name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests (deterministic embedder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install light dependencies
        run: pip install numpy pytest requests faiss-cpu
      - name: Run unit tests
        env:
          FAQCACHE_EMBEDDER: deterministic
        run: pytest -q tests/unit
      - name: Lint
        run: pip install ruff && ruff check .

  smoke:
    name: Model smoke test (real embeddings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache sentence-transformers weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: st-multilingual-minilm-l12-v2
      - name: Embedding sanity check
        run: python scripts/smoke_embeddings.py
      - name: Run integration tests
        run: pytest -q tests/integration
